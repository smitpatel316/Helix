[package]
name = "titer"
version = "1.2.0"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
percent-encoding = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

# macOS-only: the private-API feature and the Objective-C bridge. The Linux
# build (dev/test) compiles without them; the Mac DMG build is unchanged.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
